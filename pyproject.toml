[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t-cli-manager"
version = "0.1.0"
description = "A power-user CLI task manager with AI integrations"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Daiwiik", email = "you@example.com" }
]
keywords = ["cli", "task", "productivity", "todo", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "pyperclip>=1.8.2",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0"
]

[project.scripts]
task = "task_cli.main:app"
t = "task_cli.main:app"
tai = "task_cli.main:ai_app"

[tool.hatch.build.targets.wheel]
packages = ["src/task_cli"]
